name: Build & Release

# Trigger semantics:
#   - pull request into master -> verification (so changes are checked BEFORE merging).
#   - push to master  -> verification only (fast Linux runner, cancels older runs on new push, path-filtered).
#   - push of a `v*` tag -> full Windows packaging + GitHub release publish.
#   - workflow_dispatch -> manual build & publish escape hatch.
on:
  pull_request:
    branches:
      - master
    # Keep this list identical to push.paths below (spelled out: YAML anchors are avoided for compatibility).
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - 'main.js'
      - 'preload.js'
      - 'start.bat'
      - '.github/workflows/build-release.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - 'main.js'
      - 'preload.js'
      - 'start.bat'
      - '.github/workflows/build-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the release job may write (to publish releases).
permissions:
  contents: read

jobs:
  # ── Runs on pull requests and pushes to master: fast verification on Linux (1x multiplier vs Windows 2x) ──
  verify:
    name: Verify (audit, typecheck, lint, test, build)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Fails the check if any shipped dependency (including the Electron
      # runtime bundled into the EXE) has a high or critical advisory.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Next.js (standalone)
        run: npm run build

  # ── Only runs for an actual version tag or a manual dispatch: Windows packaging ───────────────
  release:
    name: Build & Publish Windows EXE
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write    # Needed to create GitHub Releases and upload assets

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # ── 4. Verify before packaging — a release build should never skip this ──
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # ── 5. Build Next.js standalone output ────────────────────────────────
      - name: Build Next.js (standalone)
        run: npm run build

      # ── 6. Determine release version ──────────────────────────────────────
      # When triggered by a pushed tag, the tag itself is authoritative (avoids
      # any chance of it disagreeing with package.json). workflow_dispatch has
      # no tag to read, so it falls back to package.json's version.
      - name: Determine release version
        id: pkg
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
            echo "Using version from pushed tag: $version"
          } else {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            echo "No tag on this run (workflow_dispatch) — using package.json version: $version"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      # ── 7. Generate icon.ico from icon.png (NSIS requires a real ICO) ──────
      - name: Generate icon.ico
        run: node scripts/generate-ico.js

      # ── 8. Build Windows installer + portable EXE ─────────────────────────
      - name: Build Electron Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      # ── 9. List produced artifacts ────────────────────────────────────────
      - name: List dist output
        shell: pwsh
        run: Get-ChildItem dist -Recurse -File | Select-Object FullName, Length

      # ── 10. Copy versioned artifacts to stable names for landing-page links ─
      # package.json pins artifactName to Chuti-Setup-<ver>.exe / Chuti-Portable-<ver>.exe,
      # which is also what latest.yml references — so the versioned files must NOT be renamed,
      # or the in-app auto-updater (electron-updater) will 404.
      - name: Copy artifacts to stable names
        shell: pwsh
        run: |
          $ver = "${{ steps.pkg.outputs.VERSION }}"
          Copy-Item "dist\Chuti-Setup-$ver.exe" "dist\Chuti-Setup.exe"
          Copy-Item "dist\Chuti-Portable-$ver.exe" "dist\Chuti-Portable.exe"
          if (-not (Test-Path "dist\latest.yml")) { throw "latest.yml was not generated; auto-update would break." }

      # ── 11. Upload as workflow artifacts (for manual download too) ─────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chuti-windows-exe
          path: |
            dist/Chuti-Setup.exe
            dist/Chuti-Setup-*.exe
            dist/Chuti-Portable.exe
            dist/Chuti-Portable-*.exe
          if-no-files-found: warn
          retention-days: 30

      # ── 12. Create/update GitHub Release with the EXE files ───────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          name: "Chuti v${{ steps.pkg.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Chuti Leave Management System — v${{ steps.pkg.outputs.VERSION }}

            ### Download
            | File | Description |
            |------|-------------|
            | **Chuti-Setup-${{ steps.pkg.outputs.VERSION }}.exe** | Installer (recommended) — installs to your chosen folder with a desktop shortcut |
            | **Chuti-Portable-${{ steps.pkg.outputs.VERSION }}.exe** | Portable — run from anywhere, no install needed |

            ### First Launch
            On first launch, Chuti will ask you to choose a **data folder** where your database, backups, and uploaded files will be stored. This folder is yours — Chuti never deletes it.

            ### Updating from an older version?
            Chuti automatically backs up your database before running any migration, and you can restore any backup from **Settings → Restore Backup** if anything looks wrong after updating. Your data folder is never touched by installing a new version.

            ### System Requirements
            - Windows 10 / 11 (64-bit)
            - No internet connection required
            - No admin rights needed (per-user install)

            ### LAN Sharing
            After starting, a popup will show the **Network URL** (e.g. `http://192.168.1.x:3000`). Share this with your team on the same Wi-Fi so they can access the app from their browsers.

            ---
            *Built automatically from commit `${{ github.sha }}`*
          files: |
            dist/Chuti-Setup.exe
            dist/Chuti-Setup-*.exe
            dist/Chuti-Setup-*.exe.blockmap
            dist/Chuti-Portable.exe
            dist/Chuti-Portable-*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
